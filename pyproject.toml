[project]
name = "omc"
version = "0.1.0"
description = "Fast mode solvers and inverse design for piezo-optomechanical crystals"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "shapely>=2.0",
    "matplotlib>=3.9",
    "jax>=0.4.30",
]

[project.optional-dependencies]
# CHOLMOD for Hermitian positive definite factorisations; omc.linalg falls back to SuperLU.
cholmod = ["scikit-sparse>=0.4.16"]
# DXF export in omc.layout.
dxf = ["ezdxf>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omc"]

# pixi: compiled dependencies from conda-forge (SuiteSparse/CHOLMOD has no PyPI wheels).
#   pixi run python validation/optics_slab_analytic.py
# Plain `uv run` also works, without CHOLMOD (SuperLU fallback).
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ name = "osx-arm64-12", platform = "osx-arm64", macos = "12.0" }, "linux-64", "win-64"]

[tool.pixi.dependencies]
python = "3.11.*"
numpy = ">=2.0"
scipy = ">=1.14"
shapely = ">=2.0"
matplotlib = ">=3.9"
scikit-sparse = ">=0.4.16"
ezdxf = ">=1.4"

# conda-forge has no win-64 jaxlib; on Windows jax comes from PyPI through omc's dependencies.
[tool.pixi.target.unix.dependencies]
jax = ">=0.4.30"

[tool.pixi.pypi-dependencies]
omc = { path = ".", editable = true }

[tool.pixi.activation.env]
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
VECLIB_MAXIMUM_THREADS = "1"
# win-64 BLAS is MKL; its default Intel threading layer crashes (0xc06d007f) against the llvm-openmp libiomp5md.
MKL_THREADING_LAYER = "SEQUENTIAL"
# Windows defaults to cp1252, which cannot print or write the Greek letters in logs.
PYTHONUTF8 = "1"
